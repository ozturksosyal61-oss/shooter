# iOS → TestFlight (Mac gerekmez). GitHub → Actions → "iOS TestFlight" → Run workflow.
# 1) Linux: Unity (GameCI) Xcode projesini üretir (ProjectSetup.BuildIos).
# 2) macOS: CocoaPods (LevelPlay / ironSource SDK), Xcode arşivler, imzalar (App Store Connect API anahtarı, otomatik), yükler.
# Gerekli secrets (Settings → Secrets and variables → Actions): UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD,
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8  (Echoes reposundakilerle aynı değerler)
# Sürüm ProjectSettings'ten (ProjectSetup.Version); build numarası UTC yyMMddHHmm → her yükleme bir öncekinden büyük (≥ 8).
name: iOS TestFlight
on:
  workflow_dispatch:

jobs:
  unity:
    name: Unity → Xcode projesi
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Disk aç
        uses: jlumbroso/free-disk-space@v1.3.1
        with: { android: true, dotnet: true, haskell: true, large-packages: false, tool-cache: false }
      - uses: actions/checkout@v4
      - name: Build numarası
        run: |
          BN=$(date -u +%y%m%d%H%M)
          if [ "$BN" -le 2611210240 ]; then BN=2611210241; fi  # last TestFlight upload 2611210240
          echo "BUILD_NUMBER=$BN" >> "$GITHUB_ENV"
      - name: Library önbelleği
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            Library-iOS-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-iOS-
      - name: Unity build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          buildMethod: ProjectSetup.BuildIos
          customParameters: -teamId ${{ secrets.APPLE_TEAM_ID }} -buildNumber ${{ env.BUILD_NUMBER }}
          versioning: None
      - name: Xcode projesini sonraki işe aktar
        uses: actions/cache/save@v4
        with:
          path: Builds/iOS
          key: xcode-${{ github.run_id }}

  xcode:
    name: Xcode → TestFlight
    needs: unity
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/cache/restore@v4
        with:
          path: Builds/iOS
          key: xcode-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: CocoaPods (LevelPlay)
        working-directory: Builds/iOS
        run: |
          if [ -f Podfile ]; then pod install --repo-update; fi
          ls
      - name: API anahtarı
        env: { ASC_KEY_P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          mkdir -p ~/keys
          printf '%s' "$ASC_KEY_P8" > ~/keys/AuthKey.p8
      - name: Entitlement kontrolü (Xcode projesi)
        run: |
          ENT=Builds/iOS/Unity-iPhone/Holdout.entitlements
          echo "::group::$ENT"; cat "$ENT" || true; echo "::endgroup::"
          if ! grep -q "com.apple.developer.game-center" "$ENT"; then
            echo "::error::$ENT içinde com.apple.developer.game-center yok (IosPostBuild.AddGameCenter çalışmadı mı?)"; exit 1
          fi
          APP_ENT=$(xcodebuild -project Builds/iOS/Unity-iPhone.xcodeproj -target Unity-iPhone -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/^ *CODE_SIGN_ENTITLEMENTS =/{print $2}')
          FW_ENT=$(xcodebuild -project Builds/iOS/Unity-iPhone.xcodeproj -target UnityFramework -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/^ *CODE_SIGN_ENTITLEMENTS =/{print $2}')
          echo "Unity-iPhone CODE_SIGN_ENTITLEMENTS = '$APP_ENT'"
          echo "UnityFramework CODE_SIGN_ENTITLEMENTS = '$FW_ENT'"
          if [ "$APP_ENT" != "Unity-iPhone/Holdout.entitlements" ]; then
            echo "::error::Unity-iPhone hedefinde CODE_SIGN_ENTITLEMENTS yanlış: '$APP_ENT'"; exit 1
          fi
      - name: Proje yolları kontrolü (.lproj + mutlak yol)
        run: |
          for l in en tr; do
            F=Builds/iOS/$l.lproj/InfoPlist.strings
            if [ ! -f "$F" ]; then echo "::error::$F yok"; exit 1; fi
            echo "$F:"; cat "$F"
          done
          grep -n "lproj" Builds/iOS/Unity-iPhone.xcodeproj/project.pbxproj | head -n 20
          if grep -n "/github/workspace" Builds/iOS/Unity-iPhone.xcodeproj/project.pbxproj; then
            echo "::error::project.pbxproj içinde mutlak /github/workspace yolu var (yukarıda)"; exit 1
          fi
      - name: Arşiv
        run: |
          if [ -d Builds/iOS/Unity-iPhone.xcworkspace ]; then SRC=(-workspace Builds/iOS/Unity-iPhone.xcworkspace); else SRC=(-project Builds/iOS/Unity-iPhone.xcodeproj); fi
          xcodebuild "${SRC[@]}" -scheme Unity-iPhone -configuration Release             -archivePath "$RUNNER_TEMP/Holdout.xcarchive" -destination "generic/platform=iOS"             CODE_SIGNING_ALLOWED=NO archive | tail -n 40
          test -d "$RUNNER_TEMP/Holdout.xcarchive"
      - name: Entitlement'ları arşive göm (Game Center)
        # Archive is unsigned (CODE_SIGNING_ALLOWED=NO) → no entitlements in the binary, and export would re-sign
        # without com.apple.developer.game-center. Ad-hoc sign with the entitlements file; export keeps them
        # (intersected with what the provisioning profile allows — checked after export).
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/Holdout.xcarchive/Products/Applications/*.app | head -n 1)
          ENT=Builds/iOS/Unity-iPhone/Holdout.entitlements
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -exec codesign --force --sign - {} \;
          fi
          # Normalize to Apple's own XML plist format (AMFI parser rejects e.g. "<true />").
          plutil -convert xml1 -o "$RUNNER_TEMP/Holdout.entitlements" "$ENT"
          plutil -lint "$RUNNER_TEMP/Holdout.entitlements"
          ENT="$RUNNER_TEMP/Holdout.entitlements"
          codesign --force --sign - --entitlements "$ENT" --generate-entitlement-der "$APP"
          echo "::group::Arşivdeki .app entitlement'ları (ad-hoc)"; codesign -d --entitlements :- "$APP"; echo "::endgroup::"
          if ! codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q "com.apple.developer.game-center"; then
            echo "::error::Ad-hoc imzalı arşivde game-center entitlement yok"; exit 1
          fi
      - name: İmzala (export)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Holdout.xcarchive"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"             -allowProvisioningUpdates -authenticationKeyPath ~/keys/AuthKey.p8             -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          ls "$RUNNER_TEMP/export"
      - name: İmzalı .app + provisioning profile kontrolü (Game Center)
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          rm -rf "$RUNNER_TEMP/ipa"; mkdir -p "$RUNNER_TEMP/ipa"; unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app | head -n 1)
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PB=/usr/libexec/PlistBuddy
          echo "Profile: $($PB -c 'Print :Name' "$RUNNER_TEMP/profile.plist") (UUID $($PB -c 'Print :UUID' "$RUNNER_TEMP/profile.plist"), bitiş $($PB -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist"))"
          echo "::group::Profile Entitlements"; $PB -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist"; echo "::endgroup::"
          echo "::group::İmzalı .app entitlement'ları"; codesign -d --entitlements :- "$APP"; echo "::endgroup::"
          FAIL=0
          if [ "$($PB -c 'Print :Entitlements:com.apple.developer.game-center' "$RUNNER_TEMP/profile.plist" 2>/dev/null)" != "true" ]; then
            echo "::error::Provisioning profile Game Center içermiyor. developer.apple.com → Identifiers → com.oztdigital.holdout → Game Center'ı işaretle + Save; Profiles'taki eski com.oztdigital.holdout App Store profillerini sil (otomatik imza yenisini üretir); ASC API anahtarı Admin/App Manager olmalı; workflow'u yeniden çalıştır."
            FAIL=1
          fi
          if ! codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q "com.apple.developer.game-center"; then
            echo "::error::İmzalı .app'te com.apple.developer.game-center yok"; FAIL=1
          fi
          # dyld: every @rpath framework the app / UnityFramework links must be inside the IPA (else instant launch crash).
          for BIN in "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")" "$APP/Frameworks/UnityFramework.framework/UnityFramework"; do
            for LIB in $(otool -L "$BIN" | awk '/@rpath\//{print $1}'); do
              REL=${LIB#@rpath/}
              if [ ! -e "$APP/Frameworks/$REL" ]; then echo "::error::$(basename "$BIN") → $LIB IPA'da yok (açılışta dyld çökmesi)"; FAIL=1; fi
            done
          done
          echo "::group::Gömülü framework'ler"; ls "$APP/Frameworks"; echo "::endgroup::"
          exit $FAIL
      - name: TestFlight'a yükle
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp ~/keys/AuthKey.p8 ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
      - name: Temizlik
        if: always()
        run: rm -rf ~/keys ~/.appstoreconnect
